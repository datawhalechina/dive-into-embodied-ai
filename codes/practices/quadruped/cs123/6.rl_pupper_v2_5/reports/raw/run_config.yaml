run:
  seed: 1
  total_timesteps: 8000000
  n_envs: 16
  device: cpu
  tensorboard: true
  output_dir: outputs/stability_polish_8m
  resume_from: ../6.rl_pupper_v2_4/reports/raw/checkpoints/pupper_ppo_7000000_steps.zip
  transfer_from: null
environment:
  max_steps: 1000
  reward_overrides:
    tracking_lin_vel: 2.0
    lin_vel_z: -2.0
    ang_vel_xy: -0.1
gait:
  enabled: true
  types:
  - trot
  contact_reward_weight: 4.0
  switch_steps: 0
ppo:
  policy: MlpPolicy
  n_steps: 2048
  batch_size: 256
  n_epochs: 4
  learning_rate: 0.0001
  gamma: 0.97
  gae_lambda: 0.95
  clip_range: 0.15
  ent_coef: 0.0005
  ent_coef_final: 0.0002
  net_arch:
  - 256
  - 256
  verbose: 1
checkpoint:
  every_steps: 1000000
  name_prefix: pupper_ppo
  final_name: pupper_ppo
