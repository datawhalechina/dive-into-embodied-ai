# 公平对照 A：从零训练，不提供步态条件。路径相对 6.rl_pupper 解析。
run:
  seed: 0
  total_timesteps: 20000000
  n_envs: 16
  device: cpu
  tensorboard: true
  output_dir: outputs/ablation_no_gait_20m
  resume_from: null
  transfer_from: null

environment:
  max_steps: 1000

gait:
  enabled: false
  types: [walk, trot, pace]
  contact_reward_weight: 0.5
  switch_steps: 500

ppo:
  policy: MlpPolicy
  n_steps: 2048
  batch_size: 256
  n_epochs: 4
  learning_rate: 0.0003
  gamma: 0.97
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  ent_coef_final: 0.001
  net_arch: [256, 256]
  verbose: 1

checkpoint:
  every_steps: 1000000
  name_prefix: pupper_no_gait
  final_name: pupper_no_gait_final
