# 路径相对 6.rl_pupper 解析；命令行参数可以覆盖 run 下的同名配置。
run:
  seed: 0
  total_timesteps: 20000000
  n_envs: 8
  # SB3 的 auto 在 Apple Silicon 上会选 CPU。实验 MPS 时改成 mps。
  device: cpu
  tensorboard: false
  output_dir: outputs
  resume_from: null
  # 仅用于把旧 45 维策略迁移到带 gait 的 50 维策略。
  transfer_from: null

environment:
  max_steps: 1000

# false 时严格保持原 45 维观测与原奖励，可直接复现实验一。
gait:
  enabled: false
  types: [walk, trot, pace]
  contact_reward_weight: 0.5
  switch_steps: 500

ppo:
  policy: MlpPolicy
  n_steps: 2048
  batch_size: 256
  n_epochs: 4
  learning_rate: 0.0003
  gamma: 0.97
  gae_lambda: 0.95
  clip_range: 0.2
  # 熵系数线性衰减：初期高熵帮助跳出"冻结不动"局部最优，后期低熵收敛平滑步态。
  ent_coef: 0.01
  ent_coef_final: 0.001
  net_arch: [256, 256]
  verbose: 1

checkpoint:
  every_steps: 1000000
  name_prefix: pupper_ppo
  final_name: pupper_ppo
