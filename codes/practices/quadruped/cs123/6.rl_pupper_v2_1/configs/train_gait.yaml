# 公平对照 B：从零训练 gait 条件策略，与 train_no_gait.yaml 使用相同预算。
run:
  seed: 0
  total_timesteps: 20000000
  n_envs: 16
  device: cpu
  tensorboard: true
  output_dir: outputs/ablation_gait_20m
  resume_from: null
  transfer_from: null

environment:
  max_steps: 1000

gait:
  enabled: true
  types: [walk, trot, pace]
  # 迁移试验的 0.5 权重不足以改变足端时序；从零对照使用更强监督。
  contact_reward_weight: 4.0
  switch_steps: 500

ppo:
  policy: MlpPolicy
  n_steps: 2048
  batch_size: 256
  n_epochs: 4
  learning_rate: 0.0003
  gamma: 0.97
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  ent_coef_final: 0.001
  net_arch: [256, 256]
  verbose: 1

checkpoint:
  every_steps: 1000000
  name_prefix: pupper_gait
  final_name: pupper_gait_final
